services:
  - type: web
    name: livre-smart-library
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: livre-library-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_PATH
        value: /var/data/library.sqlite3
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_USER_USERNAME
        value: reader
      - key: INITIAL_USER_EMAIL
        value: reader@example.invalid
      - key: INITIAL_USER_FULL_NAME
        value: Library Reader
      - key: INITIAL_USER_PASSWORD
        sync: false
